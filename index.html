<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the saved color mode before the first paint, including offline launches.
      (() => {
        let preference = "system";
        try {
          preference = localStorage.getItem("little-day:theme") || "system";
        } catch {}
        if (!["system", "light", "dark"].includes(preference))
          preference = "system";
        const dark =
          preference === "dark" ||
          (preference === "system" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f6f2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="趣日常" />
    <meta name="application-name" content="趣日常" />
    <meta
      name="description"
      content="趣日常，让日常小事多一点乐趣。随机选择、发现菜谱、记录你的生活。"
    />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/icons/icon-192.png"
    />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/assets/styles.css" />
    <link rel="stylesheet" href="/assets/compact.css" />
    <link rel="stylesheet" href="/assets/app.css" />
    <link rel="stylesheet" href="/assets/polish.css" />
    <title>趣日常 · 日常有点意思</title>
  </head>
  <body data-app="home">
    <div id="app"></div>
    <script type="module" src="/assets/js/main.js"></script>
  </body>
</html>
