<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>颐和园导览</title>
  <meta name="description" content="颐和园自动定位语音导览：走到哪儿讲到哪儿，带图片、文字、语音和推荐线路，可离线使用。" />
  <meta name="theme-color" content="#f6f0e4" />
  <meta name="color-scheme" content="light dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="颐和园导览" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="map" aria-label="颐和园地图"></div>

  <div id="top-stack" class="top-stack">
  <header id="topbar" class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">🏯</span><span class="brand-name">颐和园</span></div>
    <div class="mode" role="group" aria-label="定位方式">
      <button data-mode="auto" aria-pressed="false">自动</button>
      <button data-mode="manual" aria-pressed="true">手动</button>
    </div>
    <nav class="top-actions" aria-label="功能">
      <button class="top-btn" data-act="open-routes" aria-label="推荐线路" title="推荐线路"><span class="ic" data-ic="route"></span><span class="lb">线路</span></button>
      <button class="top-btn" data-act="open-spots" aria-label="全部景点" title="全部景点"><span class="ic" data-ic="list"></span><span class="lb">景点</span></button>
      <button class="top-btn" data-act="open-settings" aria-label="设置" title="设置"><span class="ic" data-ic="gear"></span><span class="lb">设置</span></button>
    </nav>
  </header>

  <div id="status-wrap" class="status-wrap">
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <button id="sim-exit" class="status-x" data-act="sim-exit" hidden>退出</button>
  </div>
  </div>

  <div class="map-tools" aria-label="地图工具">
    <button class="tool" data-act="zoom-in" aria-label="放大"><span class="ic" data-ic="plus"></span></button>
    <button class="tool" data-act="zoom-out" aria-label="缩小"><span class="ic" data-ic="minus"></span></button>
    <button class="tool" data-act="locate-me" aria-label="回到我的位置"><span class="ic" data-ic="locate"></span></button>
    <button class="tool" data-act="fit-park" aria-label="看整个园子"><span class="ic" data-ic="fit"></span></button>
  </div>

  <div class="osm-credit"><a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a></div>

  <section id="card" class="card" aria-label="当前景点"></section>

  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="boot" class="boot"><div class="spinner" aria-hidden="true"></div><p>正在展开颐和园地图…</p></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/icons-init.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
